name: Scrape Brooklyn.edu Events

on:
  workflow_dispatch:
  schedule:
    - cron: '35 10 * * 1'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape Brooklyn.edu events
        env:
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: npm run scrape:brooklyn -- --limit=5

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-brooklyn-debug
          path: artifacts/
          if-no-files-found: ignore
