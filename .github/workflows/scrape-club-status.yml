name: Scrape Club Status

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/scrape-club-status.mjs'
      - '.github/workflows/scrape-club-status.yml'
  schedule:
    - cron: '20 11 * * 1'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Scrape CampusGroups club status
        env:
          BC_WEBCENTRAL_USERNAME: ${{ secrets.BC_WEBCENTRAL_USERNAME }}
          BC_WEBCENTRAL_PASSWORD: ${{ secrets.BC_WEBCENTRAL_PASSWORD }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: npm run scrape:club-status

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-club-status-debug
          path: |
            artifacts/
            .auth/
          if-no-files-found: ignore
